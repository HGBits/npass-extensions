name: extension-names

on:
  push:
    branches: [master]
  pull_request:
    paths:
      - "npass-*"
      - "scripts/**"
      - "release.sh"
      - "packaging/npass-release.asc"
      - "passkey/**"
      - "Cargo.lock"
      - "tests/extension-names.bats"
      - ".github/workflows/extension-names.yml"

jobs:
  naming:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Bats
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Validate release builder syntax
        run: bash -n release.sh
      - name: Validate release builder help
        run: |
          bash release.sh --help | tee /tmp/release-help.txt
          grep -Fq './release.sh [--out DIR] [--target TRIPLE]' /tmp/release-help.txt
          grep -Fq 'git config user.signingkey' /tmp/release-help.txt
      - name: Validate extension artifact names and CLI usage
        run: bats tests/extension-names.bats
